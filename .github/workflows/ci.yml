name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Placeholders: the web build validates env, but CI never talks to a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @aisle/web build
      - run: pnpm --filter @aisle/ui build-storybook
      - name: Install Playwright browser
        run: pnpm --filter @aisle/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aisle/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  database:
    name: Migrations and RLS tests (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Auth providers are enabled in config.toml; the local stack only needs placeholder values.
      SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID: ci.placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (database and auth only)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: pgTAP tests
        run: supabase test db
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Seed demo data (twice, to prove it is re-runnable)
        run: |
          pnpm install --frozen-lockfile --filter @aisle/seed...
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres pnpm seed
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres pnpm seed
      - name: Generated types are up to date
        # Advisory until types are first regenerated from a real Supabase stack (see DECISIONS D-011).
        continue-on-error: true
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.ts
          npx --yes prettier@3.9.10 --stdin-filepath x.ts < /tmp/types.ts > /tmp/a.ts
          npx --yes prettier@3.9.10 --stdin-filepath x.ts < packages/db/src/database.types.ts > /tmp/b.ts
          diff -u /tmp/b.ts /tmp/a.ts || (echo "Run pnpm db:types and commit the result" && exit 1)
