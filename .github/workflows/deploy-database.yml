name: Deploy database (dev)

# Applies new migrations in supabase/migrations to the dev Supabase project whenever they
# land on main. Credentials live only in GitHub repository secrets:
#   SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, SUPABASE_ACCESS_TOKEN

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets are configured
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Supabase secrets are not set yet; skipping deploy. See README → Connecting real services."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Accept the bare ref, a dashboard/API URL, or a value with stray whitespace.
          ref="$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')"
          if ! printf '%s' "$ref" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project ref (found ${#ref} characters after cleanup)."
            exit 1
          fi
          supabase link --project-ref "$ref"
          # GitHub runners have no IPv6, so the CLI needs the IPv4 pooler address, which link
          # saves only if the token has "Connection Pooling: Read".
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::Could not read the connection pooler settings. Give the Supabase access token 'Connection Pooling: Read' (see README)."
            exit 1
          fi
      - name: Show pending migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase migration list --remote
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --remote --yes
